# 餐厅 seed 更新于 2026-10-19；来源、距离与价格口径见 docs/restaurant-sources.md。
# 标签分为大类、菜系、品类、就餐形式四层；词表和规则见 docs/tags.md。
# tag_groups 是启动校验的唯一来源；data/restaurants.yaml 中的标签只能使用这里声明的值。
# 餐厅清单作为首次接入统一存储的 seed 单独存放，不再写在本文件中。
bots:
- name: mock-main
  adapter: mock
  listen_addr: 127.0.0.1:18080
storage:
  type: sqlite
  dsn: ./kei.db
plugins:
  dinner:
    enabled: true
    tag_groups:
    - name: 大类
      tags:
      - 中餐
      - 西餐
      - 亚洲菜
      - 其他
    - name: 菜系
      tags:
      - 川菜
      - 淮扬菜
      - 粤菜
      - 湘菜
      - 鲁菜
      - 浙江菜
      - 闽菜
      - 徽菜
      - 西北菜
      - 东北菜
      - 云贵菜
      - 本帮菜
      - 新疆菜
      - 意大利菜
      - 法国菜
      - 美式菜
      - 墨西哥菜
      - 地中海菜
      - 韩国料理
      - 日本料理
      - 泰国菜
      - 越南菜
      - 印度菜
      - 东南亚菜
    - name: 品类
      tags:
      - 火锅
      - 烤肉
      - 面食
      - 披萨
      - 炸鸡
      - 汉堡
      - 寿司
      - 烧烤
      - 小吃
      - 轻食
      - 麻辣烫
      - 米线
      - 饺子
      - 烧腊
      - 米饭
    - name: 就餐形式
      tags:
      - 自助餐
      - 点餐
    catalog_seed: ./data/restaurants.yaml
